<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WDD130 | Quiz Form</title>
    <link rel="stylesheet" href="styles/quiz.css">
</head>
<body>
 <header>
        <h1>☑️ Basic HTML and CSS Quiz Boom</h1>
</header>
<main>
    <form>
        <fieldset>
            <div class="form-item">
                <ol>
                    <li><label for="q1">What does the acronymn CSS stand for?</label></li>
                    <input type="text" id="q1" name="q1">
                    <li><label for="q2">How are id and class attributes selected in CSS?</label></li>
                    <textarea id="q2" name="q2" rows="3"></textarea>
                    <li><label for="q3">Which of the following is a valid CSS comement</label></li>
                    <select id="q3" name="q3">
                        <option value="answer1">Choose one...</option>
                        <option value="answer2">/* Valid */</option>
                        <option value="answer3"># Valid #</option>
                        <option value="answer4">/ Valid /</option>
                        <option value="answer5">/# Valid #/</option>
                    </select>
                    <li><label for="q4">What is the bottom margin given this declaration?</label></li>
                    <img src="image/margin-de.png" alt="Example">
                    <input type="number" id="q4" name="q4">
                </ol>
            </div>
        </fieldset>
        <button type="submit">Submit Quiz</button>
    </form>
</main>
<footer>
    <p>©2024 | Quiz Form | WDD130</p>
</footer>
</body>
</html>
